<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>100 Cosas que me gustan de ti</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f0f8ff;
      font-family: 'Arial', sans-serif;
      text-align: center;
      color: #d63384;
    }

    h1, h2 {
      margin: 40px 20px 20px;
    }

    button {
      background-color: #ff66a3;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 18px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      margin-top: 30px;
    }

    .lista {
      max-width: 700px;
      margin: 20px auto;
      display: none;
      flex-direction: column;
      gap: 10px;
      animation: fadeIn 1s ease forwards;
    }

    .item {
      background: #fff0f5;
      border-radius: 15px;
      padding: 10px 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      opacity: 0;
      transform: translateY(20px);
      animation: showItem 0.5s ease forwards;
      text-align: left;
    }

    .razon-titulo {
      font-weight: bold;
      font-size: 1.1em;
      margin-bottom: 5px;
      color: #c2185b;
    }

    .poema-texto {
      font-style: italic;
      font-size: 0.95em;
      line-height: 1.4;
      white-space: pre-line;
    }

    @keyframes latido {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .corazon-palpitante {
      display: inline-block;
      animation: latido 1s infinite alternate;
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }

    @keyframes showItem {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

<audio id="musicaDeFondo" src="https://github.com/jesuxzx/Proyecto-/raw/0bc5794d80c5b528fd30a0a144196b3ec5ead152/yung%20kai%20-%20blue%20(sub.%20espa%C3%B1ol%20%2B%20lyrics).mp3" loop autoplay></audio>

function mostrarLista() {
  const lista = document.getElementById("lista");

      razonElement.textContent = `${i + 1}. ${itemData.razon}`;
